services:
  sdd-navigator-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SDD_SERVER_HOST=0.0.0.0
      - SDD_SERVER_PORT=3000
      - SDD_DATABASE_URL=postgresql://postgres:password@postgres:5432/sdd_navigator
      - SDD_LOGGING_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./test-data:/app/test-data:ro
    networks:
      - sdd-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=sdd_navigator
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sdd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sdd-navigator.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - sdd-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sdd-network:
    driver: bridge
